[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-2026-07-28-schema-reliability-demo"
version = "0.1.0"
description = "Enterprise banking agent demo: JSON Schema 2020-12, agentgateway, LangGraph -32602 repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "langchain-core>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build]
dev-mode-dirs = ["src/agent", "src/mcp"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/agent", "src/mcp"]
addopts = "-q"
