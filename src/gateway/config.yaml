# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Standalone agentgateway: LLM + MCP on 127.0.0.1:8080
# Admin UI: http://127.0.0.1:15000/ui/
# MCP backends are FastMCP on loopback; agents MUST NOT call :8001/:8002.

config:
  adminAddr: 127.0.0.1:15000

frontendPolicies:
  tracing:
    host: 127.0.0.1:4317
    protocol: grpc
    randomSampling: "1.0"
    resources:
      service.name: '"banking-fund-transfer-gateway"'

gateways:
  default:
    port: 8080
    protocol: HTTP

llm:
  gateways: [default]
  models:
    - name: "*"
      provider:
        custom:
          formats:
            - type: completions
      params:
        apiKey: "lm-studio"
        baseUrl: "http://127.0.0.1:1234/v1"

# CORS is required so the Admin UI Tool Playground (origin :15000) can call :8080.
# Path matches are prefix-only so the playground can initialize without L7 headers;
# the LangGraph client still sends Mcp-Method / Mcp-Name on every tools/call.
# CEL allows discovery (empty tool name) and transfer_funds only.

routes:
  - name: mcp-strict
    gateways: [default]
    matches:
      - path:
          pathPrefix: /mcp/strict
    policies:
      cors:
        allowOrigins:
          - "http://127.0.0.1:15000"
          - "http://localhost:15000"
        allowHeaders:
          - "*"
        exposeHeaders:
          - "Mcp-Session-Id"
          - "Mcp-Protocol-Version"
      mcpAuthorization:
        rules:
          - 'mcp.tool.name == "transfer_funds" || mcp.tool.name == ""'
    backends:
      - mcp:
          statefulMode: stateless
          targets:
            - name: banking-strict
              mcp:
                host: http://127.0.0.1:8001/mcp
  - name: mcp-legacy
    gateways: [default]
    matches:
      - path:
          pathPrefix: /mcp/legacy
    policies:
      cors:
        allowOrigins:
          - "http://127.0.0.1:15000"
          - "http://localhost:15000"
        allowHeaders:
          - "*"
        exposeHeaders:
          - "Mcp-Session-Id"
          - "Mcp-Protocol-Version"
      mcpAuthorization:
        rules:
          - 'mcp.tool.name == "transfer_funds" || mcp.tool.name == ""'
    backends:
      - mcp:
          statefulMode: stateless
          targets:
            - name: banking-legacy
              mcp:
                host: http://127.0.0.1:8002/mcp
